	<div id="wrapper">
		<div class="main-content">
			<h2 style="margin-top: 0; color: #2d6a4f;">Buat Pesanan</h2>

			<!-- Selected pemetik summary -->
			<div class="panel" style="background: #fff; border-radius: 12px; padding: 16px 20px; margin-bottom: 20px;">
				<div style="font-weight: 600; color: #2d6a4f; margin-bottom: 10px;">
					Pemetik yang Dipilih (<span id="pemetik-count">0</span>)
				</div>
				<div id="pemetik-summary" style="display: flex; gap: 12px; flex-wrap: wrap;">
					<!-- Filled by JS -->
				</div>
			</div>

			<!-- Booking form -->
			<div class="panel" style="background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 20px;">
				<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
					<div>
						<label style="display: block; font-size: 0.85rem; color: #555; margin-bottom: 6px;">
							Tanggal Mulai <span style="color: #c33;">*</span>
						</label>
						<input type="date" id="start-date" style="width: 100%; padding: 10px 12px; border: 1px solid #ccc;
                              border-radius: 6px; font-size: 0.95rem;">
					</div>
					<div>
						<label style="display: block; font-size: 0.85rem; color: #555; margin-bottom: 6px;">
							Tanggal Selesai <span style="color: #c33;">*</span>
						</label>
						<input type="date" id="end-date" style="width: 100%; padding: 10px 12px; border: 1px solid #ccc;
                              border-radius: 6px; font-size: 0.95rem;">
					</div>
				</div>

				<div style="margin-top: 16px;">
					<label style="display: block; font-size: 0.85rem; color: #555; margin-bottom: 6px;">
						Catatan (opsional)
					</label>
					<textarea id="notes" rows="3" placeholder="Catatan tambahan untuk pemetik..." style="width: 100%; padding: 10px 12px; border: 1px solid #ccc;
                             border-radius: 6px; font-size: 0.95rem; resize: vertical;"></textarea>
				</div>
			</div>

			<!-- Total summary -->
			<div class="panel" style="background: #f0fdf4; border-radius: 12px; padding: 20px; margin-bottom: 20px;">
				<div
					style="display: flex; justify-content: space-between; font-size: 0.9rem; color: #555; margin-bottom: 8px;">
					<span>Durasi</span>
					<span><strong id="summary-days">—</strong> hari</span>
				</div>
				<div
					style="display: flex; justify-content: space-between; font-size: 0.9rem; color: #555; margin-bottom: 8px;">
					<span>Harga per pemetik per hari</span>
					<span id="summary-price">—</span>
				</div>
				<div
					style="display: flex; justify-content: space-between; font-size: 0.9rem; color: #555; margin-bottom: 8px;">
					<span>Jumlah pemetik</span>
					<span>× <strong id="summary-count">—</strong></span>
				</div>
				<div style="border-top: 1px solid #c8e6c9; padding-top: 12px; margin-top: 12px;
                    display: flex; justify-content: space-between; align-items: center;">
					<span style="font-weight: 600; color: #2d6a4f; font-size: 1rem;">Total</span>
					<span id="summary-total" style="font-size: 1.3rem; font-weight: 700; color: #2d6a4f;">
						—
					</span>
				</div>
			</div>

			<!-- Error message -->
			<div id="form-error" style="display: none; padding: 12px 16px; margin-bottom: 16px;
                border-radius: 8px; background: #fdecea; color: #b71c1c;
                font-size: 0.9rem; border: 1px solid #f5c6cb;"></div>

			<!-- Action buttons -->
			<div style="display: flex; gap: 12px; justify-content: flex-end;">
				<button id="btn-cancel" style="padding: 10px 20px; border-radius: 8px; border: 1px solid #ccc;
                       background: #f5f5f5; cursor: pointer; font-size: 0.9rem;">
					Batal
				</button>
				<button id="btn-submit" style="padding: 10px 28px; border-radius: 8px; border: none;
                       background: #2d6a4f; color: #fff; cursor: pointer;
                       font-size: 0.9rem; font-weight: 600;">
					Buat Pesanan
				</button>
			</div>
