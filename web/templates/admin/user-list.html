<!DOCTYPE html>
<html lang="en">

<head>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
	<meta name="description" content="">
	<meta name="author" content="">

	<title>Halaman List Pengguna - ChatBot Cengkeh</title>

	<link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='favicon/cengkeh.png') }}">
	<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon/cengkeh.png') }}">
	<link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon/cengkeh.png') }}">

	<!-- Main Styles -->
	<link rel="stylesheet" href="{{ url_for('static', filename='styles/style.min.css') }}">

	<!-- mCustomScrollbar -->
	<link rel="stylesheet"
		href="{{ url_for('static', filename='plugin/mCustomScrollbar/jquery.mCustomScrollbar.min.css') }}">

	<!-- Waves Effect -->
	<link rel="stylesheet" href="{{ url_for('static', filename='plugin/waves/waves.min.css') }}">

	<!-- Sweet Alert -->
	<link rel="stylesheet" href="{{ url_for('static', filename='plugin/sweet-alert/sweetalert.css') }}">

	<!-- Percent Circle -->
	<link rel="stylesheet" href="{{ url_for('static', filename='plugin/percircle/css/percircle.css') }}">

	<!-- Chartist Chart -->
	<link rel="stylesheet" href="{{ url_for('static', filename='plugin/chart/chartist/chartist.min.css') }}">

	<!-- FullCalendar -->
	<link rel="stylesheet" href="{{ url_for('static', filename='plugin/fullcalendar/fullcalendar.min.css') }}">
	<link rel="stylesheet" href="{{ url_for('static', filename='plugin/fullcalendar/fullcalendar.print.css') }}"
		media='print'>

	<!-- Color Picker -->
	<link rel="stylesheet" href="{{ url_for('static', filename='color-switcher/color-switcher.min.css') }}">

	<!-- Data Tables -->
	<link rel="stylesheet"
		href="{{ url_for('static', filename='plugin/datatables/media/css/dataTables.bootstrap.min.css') }}">


</head>

<body>
	<div class="main-menu">
		<header class="header">
			<a href="index.html" class="logo">Cengkeh</a>
			<button type="button" class="button-close fa fa-times js__menu_close"></button>
			<div class="user">
				<a href="#" class="avatar"><img src="{{ url_for('static', filename='favicon/cengkeh.png') }}"
						alt=""><span class="status online"></span></a>
				<h5 class="name"><a href="profile.html">Cengkeh Admin</a></h5>
				<h5 class="position">Administrator</h5>
				<!-- /.name -->
				<div class="control-wrap js__drop_down">
					<i class="fa fa-caret-down js__drop_down_button"></i>
					<div class="control-list">
						<div class="control-item"><a href="profile.html"><i class="fa fa-user"></i> Profile</a></div>
						<div class="control-item"><a href="#"><i class="fa fa-gear"></i> Pengaturan</a></div>
						<div class="control-item"><a href="#" class="logout-link"><i class="fa fa-sign-out"></i> Log
								out</a></div>
					</div>
					<!-- /.control-list -->
				</div>
				<!-- /.control-wrap -->
			</div>
			<!-- /.user -->
		</header>
		<!-- /.header -->
		<div class="content">

			<div class="navigation">
				<h5 class="title">Navigation</h5>
				<!-- /.title -->
				<ul class="menu js__accordion">
					<li>
						<a class="waves-effect" href="{{ url_for('index') }}"><i
								class="menu-icon fa fa-home"></i><span>Dashboard</span></a>
					</li>

					<li class="current">
						<a class="waves-effect" href="{{ url_for('user_list') }}"><i
								class="menu-icon fa fa-users"></i><span>List Pengguna</span></a>
					</li>
					<!-- create a logout -->
					<li>
						<a class="waves-effect logout-link" href="#"><i
								class="menu-icon fa fa-sign-out"></i><span>Logout</span></a>
					</li>

				</ul>

			</div>
			<!-- /.navigation -->
		</div>
		<!-- /.content -->
	</div>
	<!-- /.main-menu -->

	<div class="fixed-navbar">
		<div class="pull-left">
			<button type="button"
				class="menu-mobile-button glyphicon glyphicon-menu-hamburger js__menu_mobile"></button>
			<h1 class="page-title">Halaman Utama</h1>
			<!-- /.page-title -->
		</div>
		<!-- /.pull-left -->
		<div class="pull-right">


			<a href="#" class="ico-item fa fa-power-off logout-link"></a>
		</div>
		<!-- /.pull-right -->
	</div>
	<!-- /.fixed-navbar -->



	<div id="wrapper">
		<div class="main-content">

			<!-- Stats summary -->
			<div class="row" style="margin-bottom: 20px;">
				<div class="col-md-3">
					<div class="panel" style="padding: 15px; background: #fff3cd;">
						<div style="font-size: 1.5rem; font-weight: 700;" id="count-pending">—</div>
						<div style="color: #664d03; font-size: 0.85rem;">Menunggu Persetujuan</div>
					</div>
				</div>
				<div class="col-md-3">
					<div class="panel" style="padding: 15px; background: #e8f5e9;">
						<div style="font-size: 1.5rem; font-weight: 700;" id="count-active">—</div>
						<div style="color: #1b5e20; font-size: 0.85rem;">Aktif</div>
					</div>
				</div>
				<div class="col-md-3">
					<div class="panel" style="padding: 15px; background: #f8d7da;">
						<div style="font-size: 1.5rem; font-weight: 700;" id="count-rejected">—</div>
						<div style="color: #842029; font-size: 0.85rem;">Ditolak</div>
					</div>
				</div>
				<div class="col-md-3">
					<div class="panel" style="padding: 15px; background: #e2e3e5;">
						<div style="font-size: 1.5rem; font-weight: 700;" id="count-suspended">—</div>
						<div style="color: #383d41; font-size: 0.85rem;">Ditangguhkan</div>
					</div>
				</div>
			</div>

			<!-- User table -->
			<div class="panel" style="padding: 15px; background: #fff;">
				<table id="users-table" class="table table-striped table-bordered" style="width: 100%;">
					<thead>
						<tr>
							<th>No. Telepon</th>
							<th>Nama</th>
							<th>Level</th>
							<th>Status</th>
							<th>Terdaftar</th>
							<th>Login Terakhir</th>
							<th>Aksi</th>
						</tr>
					</thead>
					<tbody><!-- filled by JS --></tbody>
				</table>
			</div>

			<!-- /.row -->
			<footer class="footer">

				<!--/#wrapper -->
				<!-- HTML5 shim and Respond.js for IE8 support of HTML5 elements and media queries -->
				<!--[if lt IE 9]>
		<script src="{{ url_for('static', filename='script/html5shiv.min.js') }}"></script>
		<script src="{{ url_for('static', filename='script/respond.min.js') }}"></script>
	<![endif]-->
				<!-- 
	================================================== -->
				<!-- Placed at the end of the document so the pages load faster -->
				<script src="{{ url_for('static', filename='scripts/jquery.min.js') }}"></script>
				<script src="{{ url_for('static', filename='scripts/modernizr.min.js') }}"></script>
				<script src="{{ url_for('static', filename='plugin/bootstrap/js/bootstrap.min.js') }}"></script>
				<script
					src="{{ url_for('static', filename='plugin/mCustomScrollbar/jquery.mCustomScrollbar.concat.min.js') }}"></script>
				<script src="{{ url_for('static', filename='plugin/nprogress/nprogress.js') }}"></script>
				<script src="{{ url_for('static', filename='plugin/sweet-alert/sweetalert.min.js') }}"></script>
				<script src="{{ url_for('static', filename='plugin/waves/waves.min.js') }}"></script>
				<!-- Full Screen Plugin -->
				<script src="{{ url_for('static', filename='plugin/fullscreen/jquery.fullscreen-min.js') }}"></script>

				<!-- Data Tables -->
				<script
					src="{{ url_for('static', filename='plugin/datatables/media/js/jquery.dataTables.min.js') }}"></script>
				<script
					src="{{ url_for('static', filename='plugin/datatables/media/js/dataTables.bootstrap.min.js') }}"></script>

				<script src="{{ url_for('static', filename='js/user-list.js') }}"></script>

				<script src="{{ url_for('static', filename='js/logout.js') }}"></script>
				<script src="{{ url_for('static', filename='scripts/main.min.js') }}"></script>
				<script src="{{ url_for('static', filename='color-switcher/color-switcher.min.js') }}"></script>
</body>

</html>
