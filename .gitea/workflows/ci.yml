name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate project structure
    runs-on: ubuntu-latest
    container:
      image: catthehacker/ubuntu:act-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show repo contents
        run: |
          echo "📁 Repository structure:"
          find . -type f -not -path './.git/*' | sort

      - name: Check required files exist
        run: |
          echo "🔍 Checking required files..."
          test -f docker-compose.yml || (echo "❌ docker-compose.yml missing" && exit 1)
          test -f .gitignore || (echo "❌ .gitignore missing" && exit 1)
          test -d db/migrations || (echo "❌ db/migrations missing" && exit 1)
          echo "✅ All required files present"

      - name: Validate docker-compose.yml with Docker Compose
        env:
          MYSQL_ROOT_PASSWORD: dummy_root
          MYSQL_DATABASE: dummy_db
          MYSQL_USER: dummy_user
          MYSQL_PASSWORD: dummy_pass
          HOST_UID: "1000"
          HOST_GID: "1000"
        run: |
          echo "🔍 Validating docker-compose.yml with docker compose config..."
          docker compose config > /dev/null
          echo "✅ docker-compose.yml passes Compose validation"

      - name: Run hello-world container
        run: |
          docker run --rm hello-world

      - name: Summary
        run: |
          echo "✅ CI validation passed!"

  
  test-migrations:
    name: Test database migrations
    runs-on: ubuntu-latest
    container:
      image: catthehacker/ubuntu:act-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare CI env
        run: cp .env.ci .env

      - name: Start compose stack and wait for healthy
        run: |
          echo "🚀 Starting db and waiting for it to be healthy..."
          docker compose up -d --wait db
          echo "✅ db is healthy"

      - name: Show db logs if previous step failed
        if: failure()
        run: docker compose logs db


      - name: Wait for MariaDB to be healthy
        run: |
          echo "⏳ Waiting for db to be healthy..."
          for i in $(seq 1 30); do
            # Get container ID for the db service — works regardless of project name
            CID=$(docker compose ps -q db)
            if [ -z "$CID" ]; then
              echo "  Attempt $i: db container not found yet"
            else
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$CID" 2>/dev/null || echo "unknown")
              echo "  Attempt $i: $STATUS"
              if [ "$STATUS" = "healthy" ]; then
                echo "✅ MariaDB is healthy"
                exit 0
              fi
            fi
            sleep 2
          done
          echo "❌ MariaDB never became healthy"
          docker compose logs db
          exit 1

      - name: Debug — show workspace and files
        run: |
          echo "=== pwd (inside job container) ==="
          pwd
          echo ""
          echo "=== ls -la (current dir) ==="
          ls -la
          echo ""
          echo "=== ls -la db ==="
          ls -la db || echo "❌ no db folder"
          echo ""
          echo "=== ls -la db/migrations ==="
          ls -la db/migrations || echo "❌ no db/migrations folder"
          echo ""
          echo "=== docker compose config (resolved paths) ==="
          docker compose config | grep -A 5 "dbmate:" || true
          echo ""
          echo "=== Inspect what the volume path resolves to ==="
          docker compose --profile tools config | grep -B 2 -A 4 "source:.*db"

      - name: Apply migrations
        env:
          HOST_WORKSPACE: ${{ github.workspace }}
        run: |
          echo "HOST_WORKSPACE=$HOST_WORKSPACE"
          docker compose --profile tools run --rm dbmate up

      - name: Verify schema
        run: |
          docker compose exec -T db mariadb -uci_user -pci_user_pass ci_test_db -e "SHOW TABLES;"
          docker compose exec -T db mariadb -uci_user -pci_user_pass ci_test_db -e "SELECT COUNT(*) FROM tb_kategori;"

      - name: Tear down
        if: always()
        run: docker compose --profile tools down -v

      