name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate project structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show repo contents
        run: |
          echo "📁 Repository structure:"
          find . -type f -not -path './.git/*' | sort

      - name: Check required files exist
        run: |
          echo "🔍 Checking required files..."
          test -f docker-compose.yml || (echo "❌ docker-compose.yml missing" && exit 1)
          test -f .gitignore || (echo "❌ .gitignore missing" && exit 1)
          test -d db/migrations || (echo "❌ db/migrations missing" && exit 1)
          echo "✅ All required files present"

      - name: Check docker-compose.yml is valid
        run: |
          echo "🔍 Checking docker-compose.yml..."
          test -s docker-compose.yml || (echo "❌ docker-compose.yml is empty or missing" && exit 1)
          grep -q '^services:' docker-compose.yml || (echo "❌ missing 'services:' top-level key" && exit 1)
          grep -q '^  db:' docker-compose.yml || (echo "❌ missing 'db' service" && exit 1)
          grep -q '^  phpmyadmin:' docker-compose.yml || (echo "❌ missing 'phpmyadmin' service" && exit 1)
          grep -q '^  dbmate:' docker-compose.yml || (echo "❌ missing 'dbmate' service" && exit 1)
          echo "✅ docker-compose.yml has expected structure"

      - name: Run hello-world container
        run: |
          docker run --rm hello-world

      - name: Summary
        run: |
          echo "✅ CI validation passed!"

      