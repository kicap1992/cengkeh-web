name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate project structure
    runs-on: ubuntu-latest
    container:
      image: catthehacker/ubuntu:act-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show repo contents
        run: |
          echo "📁 Repository structure:"
          find . -type f -not -path './.git/*' | sort

      - name: Check required files exist
        run: |
          echo "🔍 Checking required files..."
          test -f docker-compose.yml || (echo "❌ docker-compose.yml missing" && exit 1)
          test -f .gitignore || (echo "❌ .gitignore missing" && exit 1)
          test -d db/migrations || (echo "❌ db/migrations missing" && exit 1)
          echo "✅ All required files present"

      - name: Validate docker-compose.yml with Docker Compose
        env:
          MYSQL_ROOT_PASSWORD: dummy_root
          MYSQL_DATABASE: dummy_db
          MYSQL_USER: dummy_user
          MYSQL_PASSWORD: dummy_pass
          HOST_UID: "1000"
          HOST_GID: "1000"
        run: |
          echo "🔍 Validating docker-compose.yml with docker compose config..."
          docker compose config > /dev/null
          echo "✅ docker-compose.yml passes Compose validation"

      - name: Run hello-world container
        run: |
          docker run --rm hello-world

      - name: Summary
        run: |
          echo "✅ CI validation passed!"

      