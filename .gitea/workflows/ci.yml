name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate project structure
    runs-on: ubuntu-latest
    container:
      image: catthehacker/ubuntu:act-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show repo contents
        run: |
          echo "📁 Repository structure:"
          find . -type f -not -path './.git/*' | sort

      - name: Check required files exist
        run: |
          echo "🔍 Checking required files..."
          test -f docker-compose.yml || (echo "❌ docker-compose.yml missing" && exit 1)
          test -f .gitignore || (echo "❌ .gitignore missing" && exit 1)
          test -d db/migrations || (echo "❌ db/migrations missing" && exit 1)
          echo "✅ All required files present"

      - name: Validate docker-compose.yml with Docker Compose
        env:
          MYSQL_ROOT_PASSWORD: dummy_root
          MYSQL_DATABASE: dummy_db
          MYSQL_USER: dummy_user
          MYSQL_PASSWORD: dummy_pass
          HOST_UID: "1000"
          HOST_GID: "1000"
        run: |
          echo "🔍 Validating docker-compose.yml with docker compose config..."
          docker compose config > /dev/null
          echo "✅ docker-compose.yml passes Compose validation"

      - name: Run hello-world container
        run: |
          docker run --rm hello-world

      - name: Summary
        run: |
          echo "✅ CI validation passed!"

  
  test-migrations:
    name: Test database migrations
    runs-on: ubuntu-latest
    container:
      image: catthehacker/ubuntu:act-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare CI env
        run: cp .env.ci .env

      - name: Start compose stack and wait for healthy
        run: |
          echo "🚀 Starting full stack and waiting for all services to be healthy..."
          docker compose up -d --wait
          echo "✅ All healthy services started"

      - name: Show db logs if previous step failed
        if: failure()
        run: docker compose logs db


      - name: Wait for MariaDB to be healthy
        run: |
          echo "⏳ Waiting for db to be healthy..."
          for i in $(seq 1 30); do
            # Get container ID for the db service — works regardless of project name
            CID=$(docker compose ps -q db)
            if [ -z "$CID" ]; then
              echo "  Attempt $i: db container not found yet"
            else
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$CID" 2>/dev/null || echo "unknown")
              echo "  Attempt $i: $STATUS"
              if [ "$STATUS" = "healthy" ]; then
                echo "✅ MariaDB is healthy"
                exit 0
              fi
            fi
            sleep 2
          done
          echo "❌ MariaDB never became healthy"
          docker compose logs db
          exit 1

      # - name: Debug — show workspace and files
      #   run: |
      #     echo "=== pwd (inside job container) ==="
      #     pwd
      #     echo ""
      #     echo "=== ls -la (current dir) ==="
      #     ls -la
      #     echo ""
      #     echo "=== ls -la db ==="
      #     ls -la db || echo "❌ no db folder"
      #     echo ""
      #     echo "=== ls -la db/migrations ==="
      #     ls -la db/migrations || echo "❌ no db/migrations folder"
      #     echo ""
      #     echo "=== docker compose config (resolved paths) ==="
      #     docker compose config | grep -A 5 "dbmate:" || true
      #     echo ""
      #     echo "=== Inspect what the volume path resolves to ==="
      #     docker compose --profile tools config | grep -B 2 -A 4 "source:.*db"

     
      - name: Apply migrations
        run: |
          docker compose --profile tools run --rm dbmate up

      - name: Verify schema
        run: |
          docker compose exec -T db mariadb -uci_user -pci_user_pass ci_test_db -e "SHOW TABLES;"
          docker compose exec -T db mariadb -uci_user -pci_user_pass ci_test_db -e "SELECT COUNT(*) FROM tb_kategori;"

      - name: Ensure curl is available
        run: |
          if command -v curl >/dev/null 2>&1; then
            echo "✅ curl already present: $(curl --version | head -1)"
          else
            echo "📦 Installing curl..."
            apt-get update -qq && apt-get install -y -qq curl
          fi

      - name: Verify phpMyAdmin is reachable on port 8081
        run: |
          echo "🔍 Waiting for phpMyAdmin to respond on localhost:8081..."
          for i in $(seq 1 30); do
            if curl -sS -f -o /dev/null http://localhost:8081/ 2>/dev/null; then
              echo "✅ phpMyAdmin is reachable on port 8081 (attempt $i)"
              # Show a bit of the response to prove it's phpMyAdmin
              echo "--- First 3 lines of response ---"
              curl -sS http://localhost:8081/ | head -3
              exit 0
            fi
            echo "  Attempt $i: not ready yet"
            sleep 2
          done
          echo "❌ phpMyAdmin never became reachable"
          docker compose logs phpmyadmin
          exit 1

              - name: Verify phpMyAdmin responds
        run: |
          CID=$(docker compose ps -q phpmyadmin)
          IP=$(docker inspect --format='{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$CID")
          echo "phpMyAdmin container IP: $IP"
          for i in $(seq 1 30); do
            if curl -sS -f -o /dev/null "http://$IP:80/" 2>/dev/null; then
              echo "✅ phpMyAdmin responds on port 80 (internal)"
              exit 0
            fi
            sleep 2
          done
          echo "❌ phpMyAdmin never responded"
          docker compose logs phpmyadmin
          exit 1

      - name: Tear down
        if: always()
        run: docker compose --profile tools down -v

      